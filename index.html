<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Finder</title>
<meta name="description" content="Parkposition speichern und zu Fuß zurück zum Auto finden.">
<meta name="theme-color" content="#0E1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="leaflet.css">
<script>
  // Theme früh setzen, damit nichts aufblitzt
  (function () {
    try {
      var t = localStorage.getItem('carfinder.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #F2F4F3;
    --surface: #FFFFFF;
    --surface-2: #EEF1F0;
    --text: #14201C;
    --muted: #56625E;
    --border: #D5DBD8;
    --lime: #C6F432;
    --lime-ink: #0E1116;
    --primary-bg: #14201C;
    --primary-fg: #FFFFFF;
    --ring-1: rgba(20, 32, 28, 0.10);
    --ring-2: rgba(20, 32, 28, 0.20);
    --glow: rgba(150, 190, 20, 0.35);
    --route: #14201C;
    --shadow: rgba(20, 32, 28, 0.14);
    --ok: #4D7C0F;
    --warn: #C2410C;
    --err: #B91C1C;
    --me: #2563EB;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1116; --surface: #181C23; --surface-2: #1F242C; --text: #F2F4F7; --muted: #9AA3AF;
      --border: #2A3039; --primary-bg: #C6F432; --primary-fg: #0E1116; --ring-1: rgba(198, 244, 50, 0.14);
      --ring-2: rgba(198, 244, 50, 0.30); --glow: rgba(198, 244, 50, 0.35); --route: #C6F432;
      --shadow: rgba(0, 0, 0, 0.5); --ok: #C6F432; --warn: #FB923C; --err: #F87171; --me: #60A5FA;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1116; --surface: #181C23; --surface-2: #1F242C; --text: #F2F4F7; --muted: #9AA3AF;
    --border: #2A3039; --primary-bg: #C6F432; --primary-fg: #0E1116; --ring-1: rgba(198, 244, 50, 0.14);
    --ring-2: rgba(198, 244, 50, 0.30); --glow: rgba(198, 244, 50, 0.35); --route: #C6F432;
    --shadow: rgba(0, 0, 0, 0.5); --ok: #C6F432; --warn: #FB923C; --err: #F87171; --me: #60A5FA;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    transition: background-color .3s ease, color .3s ease;
  }
  button, a.btn { font: inherit; cursor: pointer; }
  .display { font-family: Sora, Manrope, system-ui, sans-serif; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; inset: 0; opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
  }
  .screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .35s ease, transform .35s ease; }

  /* ---------- Park-Screen (Layout B) ---------- */
  #screen-park {
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 28px);
    max-width: 520px; margin: 0 auto;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; white-space: nowrap; min-width: 0; overflow: hidden; }
  .brand > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .brand-mark { width: 30px; height: 30px; border-radius: 999px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; flex: none; }
  .brand-mark svg.i { width: 16px; height: 16px; stroke-width: 2.4; }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); }
  .chip[data-state="ok"] .dot { background: var(--ok); }
  .chip[data-state="warn"] .dot { background: var(--warn); }
  .chip[data-state="err"] .dot { background: var(--err); }
  .chip[data-state="search"] .dot { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 999px; border: none; background: var(--surface); color: var(--text);
    display: grid; place-items: center; box-shadow: 0 2px 10px var(--shadow);
  }
  .icon-btn svg.i { width: 20px; height: 20px; }

  .park-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 0; }
  .ring { border-radius: 999px; display: grid; place-items: center; }
  .ring.r1 { width: min(84vw, 330px); aspect-ratio: 1; border: 1px solid var(--ring-1); animation: breathe 4s ease-in-out infinite; }
  .ring.r2 { width: 82%; aspect-ratio: 1; border: 1px solid var(--ring-2); }
  @keyframes breathe { 50% { transform: scale(1.035); } }
  #parkBtn {
    position: relative; width: 80%; aspect-ratio: 1; border: none; border-radius: 999px;
    background: var(--lime); color: var(--lime-ink);
    box-shadow: 0 0 60px var(--glow), 0 10px 30px var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-family: Sora, Manrope, sans-serif; font-size: 22px; font-weight: 700;
    transition: transform .15s ease, box-shadow .3s ease;
  }
  #parkBtn:active { transform: scale(.96); }
  #parkBtn svg.i { width: 48px; height: 48px; stroke-width: 1.8; }
  #parkBtn::after {
    content: ""; position: absolute; inset: -10px; border-radius: 999px; border: 3px solid transparent;
    border-top-color: var(--lime); opacity: 0; transition: opacity .2s;
  }
  #parkBtn.locating::after { opacity: 1; animation: spin 1s linear infinite; }
  #parkBtn.done { animation: pop .5s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { 40% { transform: scale(1.06); } }
  .hint { margin: 0; font-size: 14px; color: var(--muted); text-align: center; min-height: 20px; }

  .park-footer { display: flex; justify-content: center; min-height: 52px; }
  .ghost-btn {
    height: 52px; padding: 0 20px; border-radius: 16px; border: 1.5px solid var(--border);
    background: transparent; color: var(--text); font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
  }

  /* ---------- Karten-Screen (Layout A) ---------- */
  #map { position: absolute; inset: 0; background: var(--surface-2); }
  .map-top {
    position: absolute; z-index: 500; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 16px);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none;
  }
  .map-top > * { pointer-events: auto; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--surface); box-shadow: 0 6px 20px var(--shadow); font-weight: 600; }

  .sheet {
    position: absolute; z-index: 600; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
    background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px var(--shadow);
    padding: 12px 22px calc(env(safe-area-inset-bottom) + 24px); display: flex; flex-direction: column; gap: 16px;
    transform: translateY(var(--sheet-y, 0px)); transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.dragging { transition: none; }
  .screen:not(.active) .sheet { transform: translateY(calc(var(--sheet-y, 0px) + 40px)); }
  /* Griff zum Ein-/Ausklappen */
  .handle-btn {
    align-self: center; width: 96px; height: 30px; margin: -10px 0 -8px; border: none; background: transparent;
    display: grid; place-items: center; cursor: grab; touch-action: none;
  }
  .handle-btn::before { content: ""; width: 40px; height: 5px; border-radius: 999px; background: var(--border); transition: background .2s, width .2s; }
  .handle-btn:focus-visible { outline: 2px solid var(--muted); outline-offset: -2px; border-radius: 12px; }
  .handle-btn:hover::before, .sheet.dragging .handle-btn::before { background: var(--muted); width: 48px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; touch-action: none; }
  .sheet-head .txt { flex: 1; min-width: 0; }
  .mini-route {
    flex: none; width: 56px; height: 56px; border-radius: 18px; background: var(--primary-bg); color: var(--primary-fg);
    display: grid; place-items: center; text-decoration: none;
    opacity: 0; transform: scale(.8); pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .sheet.collapsed .mini-route { opacity: 1; transform: none; pointer-events: auto; }
  .sheet-body { display: flex; flex-direction: column; gap: 16px; transition: opacity .25s; }
  .sheet.collapsed .sheet-body { opacity: 0; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .since { margin: 2px 0 0; font-size: 24px; font-weight: 600; }
  .parked-at { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px; background: var(--surface-2); border-radius: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat b { font-family: Sora, Manrope, sans-serif; font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat span { font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  a.btn.primary {
    height: 56px; border-radius: 16px; background: var(--primary-bg); color: var(--primary-fg); text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700;
    transition: transform .15s ease;
  }
  a.btn.primary:active, .ghost-btn:active, .icon-btn:active { transform: scale(.97); }
  .actions .ghost-btn { justify-content: center; width: 100%; }

  /* Leaflet-Anpassungen */
  /* Dunkle Karte: OSM-Kacheln invertiert und entsättigt – Marker bleiben unverändert */
  .map-dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.35); }
  .map-dark.leaflet-container { background: #1a1d22; }
  .leaflet-container { font-family: Manrope, system-ui, sans-serif; background: var(--surface-2); }
  .leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top) + 74px); }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted) !important; border-radius: 8px 0 0 8px; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .car-pin { width: 52px; height: 60px; position: relative; }
  .car-pin .bubble {
    width: 52px; height: 52px; border-radius: 999px; background: var(--lime); color: var(--lime-ink);
    border: 4px solid var(--surface); display: grid; place-items: center; box-shadow: 0 6px 18px var(--shadow);
  }
  .car-pin .bubble svg.i { width: 26px; height: 26px; }
  .car-pin .tip { position: absolute; left: 50%; bottom: 0; width: 14px; height: 14px; background: var(--surface); transform: translateX(-50%) rotate(45deg); border-radius: 2px; z-index: -1; }
  .me { width: 22px; height: 22px; border-radius: 999px; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 0 var(--me); animation: ping 2s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--me) 45%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }

  /* Toast */
  #toast {
    position: fixed; z-index: 1000; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 20px);
    max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--text); color: var(--bg);
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 370px) { .brand #park-title { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<!-- Icon-Sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<!-- ===== Screen 1: Parken ===== -->
<section id="screen-park" class="screen" aria-labelledby="park-title">
  <header class="topbar">
    <div class="brand display">
      <span class="brand-mark"><svg class="i"><use href="#i-pin"/></svg></span>
      <span id="park-title">Car Finder</span>

    <div class="top-actions">
      <span class="chip" id="gpsChip" data-state="search" role="status" aria-live="polite"><span class="dot"></span><span id="gpsText">GPS sucht …</span></span>
      <button class="icon-btn theme-btn" type="button" aria-label="Farbschema wechseln"><svg class="i"><use href="#i-auto"/></svg></button>

  <div class="park-stage">
    <div class="ring r1"><div class="ring r2">

  <div class="park-footer">

  <div class="map-top">
    <div class="pill display">
      <span class="brand-mark"><svg class="i"><use href="#i-pin"/></svg></span>
      <span id="map-title">Car Finder</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn theme-btn" type="button" aria-label="Farbschema wechseln"><svg class="i"><use href="#i-auto"/></svg></button>
      <button class="icon-btn" id="fitBtn" type="button" aria-label="Auto und mich anzeigen"><svg class="i"><use href="#i-target"/></svg></button>
    </div>
  </div>

  <div class="sheet">
    <button class="handle-btn" id="sheetHandle" type="button" aria-expanded="true" aria-controls="sheetBody" aria-label="Details einklappen"></button>

    </div>

<script>
(function () {
  'use strict';

  // ---------- Einstellungen ----------
  var PARK_KEY = 'carfinder.parking.v1';
  var THEME_KEY = 'carfinder.theme';
  var GOOD_ACCURACY = 20;     // m – ab hier wird sofort gespeichert
  var MAX_WAIT_MS = 12000;    // max. Wartezeit auf gutes GPS
  var WALK_M_PER_MIN = 80;    // ca. 4,8 km/h
  var DETOUR = 1.3;           // Luftlinie → realer Fußweg

  // ---------- Speicher (robust gegen blockierten Storage) ----------
  var memory = {};
  var store = {
    get: function (k) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch (e) { return memory[k] || null; }
    },
    set: function (k, v) {
      memory[k] = v;
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    }
  };

  // ---------- Helfer ----------
  var $ = function (id) { return document.getElementById(id); };
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 3200);
  }
  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function fmtDist(m) {
    if (m < 1000) return (m < 50 ? Math.round(m) : Math.round(m / 10) * 10) + ' m';
    return (m / 1000).toLocaleString('de-DE', { maximumFractionDigits: m < 10000 ? 1 : 0 }) + ' km';
  }
  function fmtWalk(m) {
    var min = Math.max(1, Math.round(m * DETOUR / WALK_M_PER_MIN));
    if (min < 60) return '≈ ' + min + ' Min';
    return '≈ ' + Math.floor(min / 60) + ' Std ' + (min % 60) + ' Min';
  }
  function fmtSince(ts) {
    var min = Math.floor((Date.now() - ts) / 60000);
    if (min < 1) return 'Gerade geparkt';
    if (min < 60) return 'Parkt seit ' + min + ' Min';
    var h = Math.floor(min / 60);
    if (h < 24) return 'Parkt seit ' + h + ' Std ' + (min % 60) + ' Min';
    var d = Math.floor(h / 24);
    return 'Parkt seit ' + d + (d === 1 ? ' Tag ' : ' Tagen ') + (h % 24) + ' Std';
  }
  function fmtParkedAt(ts) {
    var d = new Date(ts);
    return 'Geparkt am ' + d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) +
      ' um ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  // ---------- Theme (Auto / Hell / Dunkel) ----------
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var themePref = store.get(THEME_KEY) || 'auto';
  var themeIcons = { auto: '#i-auto', light: '#i-sun', dark: '#i-moon' };
  var themeNames = { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' };
  function isDark() { return themePref === 'dark' || (themePref === 'auto' && mq.matches); }
  function applyTheme() {
    var root = document.documentElement;
    if (themePref === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', themePref);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark() ? '#0E1116' : '#F2F4F3');
    document.querySelectorAll('.theme-btn').forEach(function (b) {
      b.querySelector('use').setAttribute('href', themeIcons[themePref]);
      b.setAttribute('aria-label', 'Farbschema: ' + themeNames[themePref] + ' – tippen zum Wechseln');
    });
    updateMapStyle();
  }
  document.querySelectorAll('.theme-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      themePref = { auto: 'light', light: 'dark', dark: 'auto' }[themePref];
      store.set(THEME_KEY, themePref);
      applyTheme();
      toast('Farbschema: ' + themeNames[themePref], 1500);
    });
  });
  if (mq.addEventListener) mq.addEventListener('change', function () { if (themePref === 'auto') applyTheme(); });

  // ---------- Zustand ----------
  var parking = store.get(PARK_KEY);   // {lat, lng, acc, ts}
  var lastFix = null;                  // {lat, lng, acc, ts}
  var fixListeners = [];
  var watchId = null;

  // ---------- GPS ----------
  function setChip(state, text) { $('gpsChip').setAttribute('data-state', state); $('gpsText').textContent = text; }
  function startWatch() {
    if (!('geolocation' in navigator)) { setChip('err', 'Kein GPS verfügbar'); return; }
    if (watchId !== null) return;
    watchId = navigator.geolocation.watchPosition(onFix, onGeoError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  }
  function stopWatch() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }
  function onFix(pos) {
    lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, ts: Date.now() };
    var acc = Math.round(lastFix.acc);
    if (acc <= 30) setChip('ok', 'GPS ± ' + acc + ' m');
    else setChip('warn', 'GPS ungenau ± ' + acc + ' m');
    fixListeners.slice().forEach(function (fn) { fn(lastFix); });
    updateUser();
  }
  function onGeoError(err) {
    if (err.code === 1) setChip('err', 'Kein Zugriff');
    else if (err.code === 3) setChip('search', 'GPS sucht …');
    else setChip('err', 'Kein GPS-Signal');
    fixListeners.slice().forEach(function (fn) { fn(null, err); });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopWatch(); else { startWatch(); refreshStats(); }
  });

  // Wartet auf eine möglichst genaue Position
  function getGoodFix() {
    return new Promise(function (resolve, reject) {
      if (lastFix && Date.now() - lastFix.ts < 10000 && lastFix.acc <= GOOD_ACCURACY) return resolve(lastFix);
      var best = null;
      function done(val, err) {
        clearTimeout(timer); fixListeners = fixListeners.filter(function (f) { return f !== listener; });
        if (val) resolve(val); else reject(err);
      }
      function listener(fix, err) {
        if (err && err.code === 1) return done(null, err);
        if (!fix) return;
        if (!best || fix.acc < best.acc) best = fix;
        if (best.acc <= GOOD_ACCURACY) done(best);
      }
      var timer = setTimeout(function () { best ? done(best) : done(null, { code: 3 }); }, MAX_WAIT_MS);
      fixListeners.push(listener);
      stopWatch(); startWatch();   // frischen Fix anfordern
    });
  }

  // ---------- Dauerhafter Speicher ----------
  // Bittet Chrome, die Daten dieser App nicht automatisch aufzuräumen (z. B. bei vollem Speicher).
  function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(function (already) {
          return already || navigator.storage.persist();
        }).catch(function () {});
      }
    } catch (e) {}
  }

  // ---------- Parken ----------
  var busy = false;
  function park() {
    if (busy) return;
    if (!('geolocation' in navigator)) return toast('Dieses Gerät unterstützt keine Standortabfrage.');
    busy = true;
    var btn = $('parkBtn');
    btn.classList.add('locating'); btn.setAttribute('aria-busy', 'true');
    $('parkLabel').textContent = 'Suche GPS …';
    $('parkHint').textContent = 'Warte auf ein genaues GPS-Signal …';

    getGoodFix().then(function (fix) {
      parking = { lat: fix.lat, lng: fix.lng, acc: fix.acc, ts: Date.now() };
      store.set(PARK_KEY, parking);
      requestPersist();
      if (navigator.vibrate) navigator.vibrate(40);
      btn.classList.remove('locating'); btn.classList.add('done');
      $('parkIcon').querySelector('use').setAttribute('href', '#i-check');
      $('parkLabel').textContent = 'Gespeichert';
      $('parkHint').textContent = 'Genauigkeit ± ' + Math.round(fix.acc) + ' m';
      setTimeout(function () { resetParkButton(); showScreen('map'); }, 700);
    }).catch(function (err) {
      resetParkButton();
      if (err && err.code === 1) toast('Bitte erlaube den Standortzugriff in den Browser-Einstellungen.', 5000);
      else toast('Kein GPS-Signal gefunden. Bitte nochmal versuchen.');
    }).then(function () { busy = false; });
  }
  function resetParkButton() {
    var btn = $('parkBtn');
    btn.classList.remove('locating', 'done'); btn.removeAttribute('aria-busy');
    $('parkIcon').querySelector('use').setAttribute('href', '#i-car');
    $('parkLabel').textContent = 'Jetzt parken';
    $('parkHint').textContent = 'Ein Tipp speichert deine aktuelle Position';
  }

  // ---------- Karte ----------
  var followUser = true;
  var map = null, tiles = null, carMarker = null, meMarker = null, line = null;
  // OpenStreetMap-Standardkarte: kostenlos, ohne API-Key.
  // Dunkelmodus: dieselbe Karte, per CSS-Filter abgedunkelt (siehe .map-dark).
  var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  var ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

  function ensureMap() {
    if (map || typeof L === 'undefined') return;
    map = L.map('map', { zoomControl: false, attributionControl: false, maxZoom: 19 });
    L.control.attribution({ position: 'topright', prefix: false }).addTo(map);
    map.on('dragstart', function () { followUser = false; });
    map.on('zoomstart', function () { if (!programmatic) followUser = false; });
    tiles = L.tileLayer(TILE_URL, { maxZoom: 19, attribution: ATTR, referrerPolicy: 'strict-origin-when-cross-origin' }).addTo(map);
    updateMapStyle();
  }
  function updateMapStyle() {
    if (!map) return;
    document.getElementById('map').classList.toggle('map-dark', isDark());
    if (line) line.setStyle({ color: cssVar('--route') });
  }
  var carIcon = function () {
    return L.divIcon({ className: '', iconSize: [52, 60], iconAnchor: [26, 60],
      html: '<div class="car-pin"><div class="bubble"><svg class="i"><use href="#i-car"/></svg></div><div class="tip"></div></div>' });
  };
  var meIcon = function () { return L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="me"></div>' }); };

  function drawCar() {
    if (!map || !parking) return;
    var ll = [parking.lat, parking.lng];
    if (!carMarker) carMarker = L.marker(ll, { icon: carIcon(), keyboard: false, title: 'Dein Auto' }).addTo(map);
    else carMarker.setLatLng(ll);
  }
  function updateUser() {
    if (map && lastFix) {
      var ll = [lastFix.lat, lastFix.lng];
      if (!meMarker) meMarker = L.marker(ll, { icon: meIcon(), keyboard: false, interactive: false, zIndexOffset: -10 }).addTo(map);
      else meMarker.setLatLng(ll);
      if (parking) {
        var pts = [ll, [parking.lat, parking.lng]];
        if (!line) line = L.polyline(pts, { color: cssVar('--route'), weight: 4, dashArray: '1 10', lineCap: 'round', interactive: false }).addTo(map);
        else line.setLatLngs(pts);
      }
      if (followUser && current === 'map') fitView();
    }
    refreshStats();
  }
  var programmatic = false;
  function fitView() {
    if (!map || !parking) return;
    programmatic = true; setTimeout(function () { programmatic = false; }, 600);
    var car = L.latLng(parking.lat, parking.lng);
    var sheetH = visibleSheetHeight() || 320;
    if (lastFix && haversine(lastFix, parking) < 15000) {
      map.fitBounds(L.latLngBounds([car, [lastFix.lat, lastFix.lng]]), {
        paddingTopLeft: [50, 120], paddingBottomRight: [50, sheetH + 40], maxZoom: 18
      });
    } else {
      map.setView(car, 17);
      map.panBy([0, sheetH / 2 - 40], { animate: false });
    }
  }
  $('fitBtn').addEventListener('click', function () { followUser = true; fitView(); });

  // ---------- Werte im Sheet ----------
  function refreshStats() {
    if (!parking) return;
    $('since').textContent = fmtSince(parking.ts);
    $('parkedAt').textContent = fmtParkedAt(parking.ts);
    $('statAcc').textContent = '± ' + Math.round(parking.acc) + ' m';
    if (lastFix) {
      var d = haversine(lastFix, parking);
      $('statDist').textContent = fmtDist(d);
      $('statWalk').textContent = d < 15 ? 'Da!' : fmtWalk(d);
    } else {
      $('statDist').textContent = '–'; $('statWalk').textContent = '–';
    }
    var routeUrl = 'https://www.google.com/maps/dir/?api=1&destination=' +
      parking.lat.toFixed(6) + ',' + parking.lng.toFixed(6) + '&travelmode=walking';
    $('routeBtn').href = routeUrl; $('routeMini').href = routeUrl;
  }
  setInterval(refreshStats, 30000);

  // ---------- Ausklappbares Info-Panel ----------
  var SHEET_KEY = 'carfinder.sheetCollapsed';
  var sheet = document.querySelector('.sheet'), sheetHead = $('sheetHead'), sheetBody = $('sheetBody'), sheetHandle = $('sheetHandle');
  var sheetCollapsed = store.get(SHEET_KEY) === true;
  var sheetY = 0;
  function collapsedOffset() {
    var padB = parseFloat(getComputedStyle(sheet).paddingBottom) || 0;
    return Math.max(0, sheet.offsetHeight - (sheetHead.offsetTop + sheetHead.offsetHeight) - padB);
  }
  function setSheetY(y) { sheetY = y; sheet.style.setProperty('--sheet-y', y + 'px'); }
  function visibleSheetHeight() { return sheet.offsetHeight - sheetY; }
  function setSheet(collapsed, refit) {
    sheetCollapsed = collapsed;
    setSheetY(collapsed ? collapsedOffset() : 0);
    sheet.classList.toggle('collapsed', collapsed);
    sheetBody.inert = collapsed;
    $('routeMini').tabIndex = collapsed ? 0 : -1;
    sheetHandle.setAttribute('aria-expanded', String(!collapsed));
    sheetHandle.setAttribute('aria-label', collapsed ? 'Details ausklappen' : 'Details einklappen');
    store.set(SHEET_KEY, collapsed);
    if (refit && followUser) setTimeout(fitView, 420);
  }
  var drag = null;
  function sheetDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('a') ) return;           // Klick auf den Route-Knopf nicht abfangen
    drag = { y0: e.clientY, t0: performance.now(), base: sheetY, max: collapsedOffset(), moved: false, y: sheetY };
    sheet.classList.add('dragging');
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function sheetMove(e) {
    if (!drag) return;
    var dy = e.clientY - drag.y0;
    if (Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    drag.y = Math.min(drag.max, Math.max(0, drag.base + dy));
    setSheetY(drag.y);
  }
  function sheetUp(e) {
    if (!drag) return;
    sheet.classList.remove('dragging');
    var d = drag; drag = null;
    if (!d.moved) { setSheet(!sheetCollapsed, true); return; }
    var velocity = (e.clientY - d.y0) / Math.max(1, performance.now() - d.t0);   // px pro ms
    var collapse = Math.abs(velocity) > 0.4 ? velocity > 0 : d.y > d.max / 2;
    setSheet(collapse, true);
  }
  [sheetHandle, sheetHead].forEach(function (el) {
    el.addEventListener('pointerdown', sheetDown);
    el.addEventListener('pointermove', sheetMove);
    el.addEventListener('pointerup', sheetUp);
    el.addEventListener('pointercancel', sheetUp);
  });
  // Tastatur: Enter/Leertaste auf dem Griff
  sheetHandle.addEventListener('click', function (e) { if (e.detail === 0) setSheet(!sheetCollapsed, true); });
  window.addEventListener('resize', function () { if (sheetCollapsed) setSheetY(collapsedOffset()); });

  // ---------- Navigation zwischen Screens ----------
  var current = null;
  function showScreen(name) {
    current = name;
    $('screen-park').classList.toggle('active', name === 'park');
    $('screen-map').classList.toggle('active', name === 'map');
    $('backToMap').hidden = !(name === 'park' && parking);
    if (name === 'map') {
      followUser = true;
      refreshStats();
      setSheet(sheetCollapsed, false);
      ensureMap();
      if (map) {
        map.invalidateSize();
        drawCar(); updateUser(); fitView();
        setTimeout(function () { map.invalidateSize(); fitView(); }, 380);
      } else {
        refreshStats();
        toast('Karte konnte nicht geladen werden – Route funktioniert trotzdem.');
      }
    }
  }
  $('parkBtn').addEventListener('click', park);
  $('reparkBtn').addEventListener('click', function () { showScreen('park'); });
  $('backToMap').addEventListener('click', function () { showScreen('map'); });

  // ---------- Start ----------
  applyTheme();
  startWatch();
  if (parking) requestPersist();
  var params = new URLSearchParams(location.search);
  if (params.get('action') === 'park') {
    history.replaceState(null, '', location.pathname);
    showScreen('park');
    park();
  } else {
    showScreen(parking ? 'map' : 'park');
  }

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
